name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Java 21 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission to Maven wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x mvnw

      - name: Run Maven verification and packaging
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress clean verify package

      - name: List generated JAR files
        shell: bash
        run: |
          find target -maxdepth 1 -type f -name "*.jar" -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ matrix.os }}
          path: target/*.jar
          if-no-files-found: error