name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Java 21 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify "-Dbuild.number=${{ github.run_number }}"

      - name: Run Maven verification on Unix
        if: ${{ runner.os != 'Windows' }}
        run: ./mvnw --batch-mode --no-transfer-progress clean verify "-Dbuild.number=${{ github.run_number }}"

      - name: Test executable JAR --version on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path target -Filter '*-all.jar' | Select-Object -First 1
          if (-not $jar) { throw 'Executable JAR was not created' }
          java -jar $jar.FullName --version

      - name: Test executable JAR --version on Unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          jar=$(find target -maxdepth 1 -name "*-all.jar" -print -quit)
          test -n "$jar"
          java -jar "$jar" --version

      - name: Upload build artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/*-all.jar